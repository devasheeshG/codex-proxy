name: Release Codex Proxy macOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.1.0)
        required: true
        default: 0.1.0
  push:
    tags:
      - "macos-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Codex Proxy macOS app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/codex-menu-bar
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#macos-v}"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=macos-v$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: swift build --configuration release

      - name: Assemble and sign application bundle
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          app="$RUNNER_TEMP/Codex Proxy.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp .build/release/CodexMenuBar "$app/Contents/MacOS/CodexMenuBar"
          cp Resources/Info.plist "$app/Contents/Info.plist"
          cp Sources/CodexMenuBar/Resources/OpenAIMark.svg "$app/Contents/Resources/OpenAIMark.svg"
          iconset="$RUNNER_TEMP/CodexProxy.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -s format png -z "$size" "$size" Sources/CodexMenuBar/Resources/OpenAIMark.svg --out "$iconset/icon_${size}x${size}.png" >/dev/null
            doubled=$((size * 2))
            sips -s format png -z "$doubled" "$doubled" Sources/CodexMenuBar/Resources/OpenAIMark.svg --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/OpenAIMark.icns"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$app/Contents/Info.plist"
          chmod +x "$app/Contents/MacOS/CodexMenuBar"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          hdiutil create -volname "Codex Proxy" -srcfolder "$app" -ov -format UDZO "$GITHUB_WORKSPACE/artifacts/Codex-Proxy-macOS.dmg" >/dev/null

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Codex Proxy macOS ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          files: |
            artifacts/Codex-Proxy-macOS.dmg
