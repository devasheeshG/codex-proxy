name: Release Codex Proxy macOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 0.1.0)
        required: true
        default: 0.1.0
  push:
    tags:
      - "macos-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Codex Proxy macOS app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/codex-menu-bar
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#macos-v}"
          else
            version="${{ inputs.version }}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=macos-v$version" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode host project
        run: cd Host && xcodegen generate --spec project.yml

      - name: Build and test macOS host project
        run: xcodebuild test -project Host/CodexProxy.xcodeproj -scheme CodexProxy -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

      - name: Archive host app and embedded widget
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cd Host
          xcodebuild archive -project CodexProxy.xcodeproj -scheme CodexProxy -configuration Release -archivePath "$RUNNER_TEMP/CodexProxy.xcarchive" CODE_SIGNING_ALLOWED=NO SKIP_INSTALL=NO
          app="$RUNNER_TEMP/CodexProxy.xcarchive/Products/Applications/Codex Proxy.app"
          test -d "$app/Contents/PlugIns/CodexProxyWidget.appex"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$app/Contents/Info.plist"
          staging="$RUNNER_TEMP/Codex Proxy Installer"
          mkdir -p "$staging"
          cp -R "$app" "$staging/Codex Proxy.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Codex Proxy" -srcfolder "$staging" -ov -format UDZO "$GITHUB_WORKSPACE/artifacts/Codex-Proxy-macOS.dmg" >/dev/null

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Codex Proxy macOS ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          files: |
            artifacts/Codex-Proxy-macOS.dmg
