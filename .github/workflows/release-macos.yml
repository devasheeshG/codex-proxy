name: Release Codex Proxy macOS app
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
  push:
    tags: ["macos-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#macos-v}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then version="$INPUT_VERSION"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: brew install librsvg
      - name: Test, package and launch exact DMG app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_ARTIFACTS_codex-menu-bar: ${{ github.workspace }}/artifacts
          APP_SNAPSHOT_codex-menu-bar: ${{ github.workspace }}/artifacts
        run: clients/codex-menu-bar/scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Codex-macOS-validation
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-v${{ steps.version.outputs.version }}
          name: Codex Proxy macOS ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: artifacts/Codex-Proxy-macOS.dmg
