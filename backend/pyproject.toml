[project]
name = "codex-proxy"
version = "0.1.0"
description = "Centralized team proxy for Codex: rotates a pool of subscription accounts and tracks per-user usage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "gunicorn>=23.0",
    "sqlalchemy>=2.0",
    "sqlalchemy-utils>=0.41",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "pyjwt>=2.10",
    "alembic>=1.14",
    "cryptography>=44.0",
    "httpx>=0.28",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "respx>=0.22",
    "testcontainers[postgres]>=4.14.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

