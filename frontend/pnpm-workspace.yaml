packages: []

# Native packages allowed to run their install/build scripts.
# `allowBuilds` is read by pnpm >=10; `onlyBuiltDependencies` by pnpm 9
# (the version pinned in the Docker build). Keep both in sync.
allowBuilds:
    "@tailwindcss/oxide": true
    sharp: true
    unrs-resolver: true

onlyBuiltDependencies:
    - "@tailwindcss/oxide"
    - sharp
    - unrs-resolver
